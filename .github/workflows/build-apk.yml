name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix AGP Version & Build APK
      run: |
        if [ -d "quiz-master (1)" ]; then
          cd "quiz-master (1)"
        fi

        # ১. ভুল Windows Path মুছে ফেলা
        rm -f local.properties

        # ২. অকার্যকর AGP 9.1.1 কে পরিবর্তন করে Stable AGP 8.2.2 এ নামিয়ে আনা
        find . -name "build.gradle.kts" -exec sed -i 's/9.1.1/8.2.2/g' {} +
        find . -name "build.gradle" -exec sed -i 's/9.1.1/8.2.2/g' {} +

        # ৩. Gradle Wrapper ৮.২ এ ডাউনগ্রেড করা যাতে AGP 8.2.2 এর সাথে ম্যাচ করে
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/gradle-.*-bin.zip/gradle-8.2-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuizMaster-APK
        path: "**/build/outputs/apk/debug/*.apk"
