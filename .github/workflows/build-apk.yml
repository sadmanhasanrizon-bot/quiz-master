name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Gradle Version & Build APK
      run: |
        if [ -d "quiz-master (1)" ]; then
          cd "quiz-master (1)"
        fi
        
        # Auto update Gradle wrapper to 9.3.1
        sed -i 's/gradle-9.3.0-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuizMaster-APK
        path: |
          quiz-master (1)/app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk
