name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Fix Environment & Build APK
      run: |
        # প্রজেক্ট ফোল্ডারে ঢোকা
        if [ -d "quiz-master (1)" ]; then
          cd "quiz-master (1)"
        fi

        # উইন্ডোজের ক্যাশ ফাইল রিমুভ
        rm -f local.properties

        # গ্র্যাডল ভার্সন অটো-ফিক্স
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/gradle-9.3.0-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
        fi

        chmod +x gradlew

        # মেমোরি ৪ জিবি বাড়িয়ে ক্র্যাশ ফিক্স করা
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuizMaster-APK
        path: "**/build/outputs/apk/debug/*.apk"
