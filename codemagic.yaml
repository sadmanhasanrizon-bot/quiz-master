workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            cd quiz-master* || cd quiz* || exit 1
            chmod +x gradlew
            ./gradlew assembleDebug
          fi
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
